<svg width="1500" height="980" viewBox="0 0 1500 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1500" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="0.46" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="hero2" x1="50" y1="40" x2="1450" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 36px 'Segoe UI', Arial, sans-serif; fill: white; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: rgba(255,255,255,0.9); }
      .section { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .edge { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow2); stroke-linecap: round; stroke-linejoin: round; }
      .edge-soft { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow2); stroke-linecap: round; stroke-linejoin: round; }
      .edge-dash { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow2); stroke-linecap: round; stroke-linejoin: round; }
      .edge-pass { stroke: #475569; stroke-opacity: 0.38; stroke-width: 3; fill: none; marker-end: url(#arrow2); stroke-linecap: round; stroke-linejoin: round; }
      .edge-pass-dash { stroke: #64748b; stroke-opacity: 0.34; stroke-width: 2.5; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow2); stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1500" height="980" rx="28" fill="url(#bg2)"/>
  <rect x="40" y="36" width="1420" height="126" rx="28" fill="url(#hero2)" filter="url(#shadow2)"/>
  <text x="74" y="94" class="title">rbsdPredict Package Workflow</text>
  <text x="74" y="128" class="subtitle">Raw climate inputs branch into clustering, machine-learning, hybrid modeling, and shared prediction utilities.</text>

  <text x="68" y="214" class="section">A. Inputs and preparation</text>
  <text x="410" y="214" class="section">B. Clustering and diagnostics</text>
  <text x="800" y="214" class="section">C. Modeling paths</text>
  <text x="1170" y="214" class="section">D. Shared prediction outputs</text>

  <g filter="url(#shadow2)">
    <rect x="60" y="258" width="270" height="126" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
    <text x="86" y="302" class="node-title">Input data</text>
    <text x="86" y="330" class="node-text">Core climate variables: tmax, tmin, RH</text>
    <text x="86" y="352" class="node-text">Optional context: RF, PET, WS</text>

    <rect x="60" y="432" width="270" height="156" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="86" y="476" class="node-title">preprocess_data</text>
    <text x="86" y="504" class="node-text">Missing-value handling</text>
    <text x="86" y="526" class="node-text">Feature normalization options</text>
    <text x="86" y="548" class="node-text">Train/test split for ML workflows</text>

    <rect x="390" y="258" width="300" height="132" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="416" y="302" class="node-title">cluster_analysis</text>
    <text x="416" y="330" class="node-text">Hierarchical clustering on tmax, tmin, RH</text>
    <text x="416" y="352" class="node-text">Returns cluster_result and cluster labels</text>

    <rect x="390" y="450" width="300" height="156" rx="24" fill="#fef3c7" stroke="#eab308" stroke-width="2.5"/>
    <text x="416" y="494" class="node-title">Cluster plots</text>
    <text x="416" y="522" class="node-text">plot_dendrogram(cluster_result)</text>
    <text x="416" y="544" class="node-text">plot_cluster_boxplots(cluster_result, data)</text>
    <text x="416" y="566" class="node-text">Visual diagnostics for cluster separation</text>

    <rect x="760" y="258" width="300" height="156" rx="24" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <text x="786" y="302" class="node-title">ML path</text>
    <text x="786" y="330" class="node-text">train_ml_models(processed_data)</text>
    <text x="786" y="352" class="node-text">Fits multiple models for A and PDI</text>
    <text x="786" y="374" class="node-text">Stores train/test sets and RMSE, R2, MAE</text>

    <rect x="760" y="470" width="300" height="128" rx="24" fill="#fae8ff" stroke="#c026d3" stroke-width="2.5"/>
    <text x="786" y="514" class="node-title">ML evaluation</text>
    <text x="786" y="542" class="node-text">evaluate_model(ml_models)</text>
    <text x="786" y="564" class="node-text">rank_models(ml_models)</text>

    <rect x="760" y="650" width="300" height="176" rx="24" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
    <text x="786" y="694" class="node-title">Hybrid path</text>
    <text x="786" y="722" class="node-text">train_hybrid_model(data)</text>
    <text x="786" y="744" class="node-text">Internally runs cluster_analysis</text>
    <text x="786" y="766" class="node-text">Builds rule boxes and centroid fallback</text>
    <text x="786" y="788" class="node-text">Fits cluster-wise regressions for A and PDI</text>

    <rect x="1130" y="258" width="320" height="132" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="1156" y="302" class="node-title">predict_rbsd</text>
    <text x="1156" y="330" class="node-text">Uses trained ML or hybrid objects</text>
    <text x="1156" y="352" class="node-text">Predicts A or PDI on newdata</text>

    <rect x="1130" y="452" width="320" height="132" rx="24" fill="#ecfccb" stroke="#84cc16" stroke-width="2.5"/>
    <text x="1156" y="496" class="node-title">simulate_climate_scenarios</text>
    <text x="1156" y="524" class="node-text">Applies dtmax, dtmin, dRH to baseline data</text>
    <text x="1156" y="546" class="node-text">Calls predict_rbsd across scenario grids</text>

    <rect x="1130" y="646" width="320" height="182" rx="24" fill="#fff1f2" stroke="#e11d48" stroke-width="2.5"/>
    <text x="1156" y="690" class="node-title">Reporting outputs</text>
    <text x="1156" y="718" class="node-text">plot_actual_vs_predicted(actual, predicted)</text>
    <text x="1156" y="740" class="node-text">plot_risk_map(data, model, type)</text>
    <text x="1156" y="762" class="node-text">summarize_cluster_equations(hybrid_model)</text>
    <text x="1156" y="784" class="node-text">Tables, figures, and scenario summaries</text>
  </g>

  <path d="M330 320 C 356 320, 364 320, 390 320" class="edge-soft"/>
  <path d="M195 384 C 195 406, 195 412, 195 432" class="edge"/>
  <path d="M540 390 C 540 416, 540 426, 540 450" class="edge"/>
  <path d="M330 510 C 520 510, 592 336, 760 336" class="edge-pass"/>
  <path d="M330 544 C 560 544, 610 724, 760 724" class="edge-pass"/>
  <path d="M690 320 C 720 320, 730 320, 760 320" class="edge-dash"/>
  <path d="M690 340 C 730 340, 730 700, 760 700" class="edge-pass-dash"/>
  <path d="M1060 324 C 1090 324, 1100 324, 1130 324" class="edge"/>
  <path d="M1060 534 C 1090 534, 1100 518, 1130 518" class="edge-soft"/>
  <path d="M1060 738 C 1090 738, 1100 738, 1130 738" class="edge"/>
  <path d="M1290 390 C 1290 416, 1290 426, 1290 452" class="edge-soft"/>
  <path d="M1290 584 C 1290 614, 1290 620, 1290 646" class="edge-soft"/>

</svg>
