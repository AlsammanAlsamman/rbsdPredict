<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6fff8"/>
      <stop offset="0.5" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="header" x1="60" y1="40" x2="1340" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.5" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: white; }
      .subtitle { font: 400 16px 'Segoe UI', Arial, sans-serif; fill: rgba(255,255,255,0.88); }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-title { font: 700 19px 'Segoe UI', Arial, sans-serif; fill: #0f172a; }
      .node-text { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .edge { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); opacity: 0.9; }
      .edge-soft { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); opacity: 0.85; }
    </style>
  </defs>

  <rect x="0" y="0" width="1400" height="900" rx="28" fill="url(#bg)"/>
  <rect x="40" y="36" width="1320" height="120" rx="28" fill="url(#header)" filter="url(#shadow)"/>
  <text x="72" y="92" class="title">rbsdPredict Package Workflow</text>
  <text x="72" y="126" class="subtitle">Climate-driven preprocessing, clustering, hybrid/ML modeling, prediction, interpretation, and decision support</text>

  <text x="80" y="215" class="section">1. Input and preparation</text>
  <text x="500" y="215" class="section">2. Modeling paths</text>
  <text x="960" y="215" class="section">3. Outputs and decisions</text>

  <g filter="url(#shadow)">
    <rect x="70" y="250" width="290" height="120" rx="24" fill="#dcfce7" stroke="#22c55e" stroke-width="2.5"/>
    <text x="95" y="292" class="node-title">Input data</text>
    <text x="95" y="320" class="node-text">Meteorological drivers:</text>
    <text x="95" y="342" class="node-text">tmax, tmin, RH, optional RF, PET, WS</text>

    <rect x="70" y="430" width="290" height="140" rx="24" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="95" y="472" class="node-title">preprocess_data</text>
    <text x="95" y="500" class="node-text">Missing value handling</text>
    <text x="95" y="522" class="node-text">Feature normalization</text>
    <text x="95" y="544" class="node-text">Train/test partitioning</text>

    <rect x="455" y="250" width="220" height="95" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="483" y="302" class="node-title">Model choice</text>
    <text x="483" y="326" class="node-text">ML or Hybrid workflow</text>

    <rect x="430" y="410" width="270" height="165" rx="24" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
    <text x="455" y="452" class="node-title">train_ml_models</text>
    <text x="455" y="480" class="node-text">lm, rf, xgbTree, svm, knn, nnet</text>
    <text x="455" y="502" class="node-text">Cross-validation metrics</text>
    <text x="455" y="524" class="node-text">rank_models and evaluate_model</text>

    <rect x="760" y="410" width="300" height="200" rx="24" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
    <text x="786" y="452" class="node-title">train_hybrid_model</text>
    <text x="786" y="480" class="node-text">Hierarchical clustering of climate regimes</text>
    <text x="786" y="502" class="node-text">Rule-box assignment + centroid fallback</text>
    <text x="786" y="524" class="node-text">Cluster-wise regressions for A and PDI</text>
    <text x="786" y="546" class="node-text">summarize_cluster_equations</text>

    <rect x="1120" y="250" width="220" height="95" rx="24" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
    <text x="1146" y="302" class="node-title">predict_rbsd</text>
    <text x="1146" y="326" class="node-text">Predict A or PDI</text>

    <rect x="1090" y="410" width="270" height="110" rx="24" fill="#fef3c7" stroke="#eab308" stroke-width="2.5"/>
    <text x="1115" y="452" class="node-title">Visual outputs</text>
    <text x="1115" y="480" class="node-text">plot_actual_vs_predicted, plot_risk_map</text>

    <rect x="1090" y="585" width="270" height="120" rx="24" fill="#ecfccb" stroke="#84cc16" stroke-width="2.5"/>
    <text x="1115" y="627" class="node-title">Decision support</text>
    <text x="1115" y="655" class="node-text">Early warning, hotspot screening,</text>
    <text x="1115" y="677" class="node-text">scenario analysis, interpretable reporting</text>

    <rect x="430" y="650" width="270" height="120" rx="24" fill="#fae8ff" stroke="#c026d3" stroke-width="2.5"/>
    <text x="455" y="692" class="node-title">simulate_climate_scenarios</text>
    <text x="455" y="720" class="node-text">Climate perturbation experiments</text>
    <text x="455" y="742" class="node-text">Mean summary across scenario grid</text>
  </g>

  <path d="M360 310 C 400 310, 405 298, 455 298" class="edge"/>
  <path d="M565 345 C 565 372, 565 382, 565 410" class="edge"/>
  <path d="M620 345 C 720 345, 790 360, 910 410" class="edge"/>
  <path d="M700 492 C 860 492, 960 300, 1120 300" class="edge"/>
  <path d="M1060 510 C 1085 510, 1090 510, 1120 510" class="edge"/>
  <path d="M1230 345 C 1230 375, 1230 385, 1230 410" class="edge-soft"/>
  <path d="M1230 520 C 1230 548, 1230 556, 1230 585" class="edge"/>
  <path d="M700 710 C 900 710, 950 655, 1090 645" class="edge-soft"/>
  <path d="M565 570 C 565 608, 565 618, 565 650" class="edge-soft"/>
  <path d="M910 610 C 910 660, 1030 660, 1090 650" class="edge-soft"/>

  <circle cx="392" cy="298" r="7" fill="#475569"/>
  <circle cx="565" cy="377" r="7" fill="#475569"/>
  <circle cx="732" cy="372" r="7" fill="#475569"/>
  <circle cx="1015" cy="510" r="7" fill="#475569"/>

  <text x="83" y="820" class="small">Color map: green = inputs, blue = preprocessing/prediction, pink/orange = modeling engines, yellow/green = outputs and decisions.</text>
  <text x="83" y="846" class="small">Included package functions: preprocess_data, train_ml_models, evaluate_model, rank_models, train_hybrid_model, summarize_cluster_equations, predict_rbsd, plot_actual_vs_predicted, plot_risk_map, simulate_climate_scenarios.</text>
</svg>